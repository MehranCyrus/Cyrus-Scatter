<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyrus Scatter 0.73 · Layout study</title>
<style>
:root{color-scheme:dark;--page:#242424;--panel:#3c3c3c;--field:#303030;--text:#eee;--muted:#c1c1c1;--blue:#386d96;--focus:#84b4db}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--page);color:var(--text);font:12px "Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;min-height:100vh}
button,input,select{font:inherit;color:inherit;border:1px solid #656565;border-radius:1px;min-width:0}
button{background:#555;padding:3px 7px;line-height:17px;cursor:pointer}
button:hover:not(:disabled){background:#646464;border-color:#909090}
button:active:not(:disabled){background:#414141}
button:disabled,input:disabled,select:disabled{opacity:.48;cursor:default}
button.primary{background:var(--blue);border-color:#6892b5}
button.primary:hover:not(:disabled){background:#447da8}
input:not([type=checkbox]):not([type=radio]),select{width:100%;background:var(--field);padding:2px 5px;min-height:24px}
input[type=number]{text-align:right;padding-right:1px}
input[type=checkbox],input[type=radio]{accent-color:#729bc0;margin:0;flex:none;width:13px;height:13px}
input[type=color]{padding:1px;height:24px}
select{padding-right:2px}
select[size]{padding:2px;line-height:19px}
select option{padding:2px 4px}
select option:checked{background:#386585;color:#fff}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.study{--panel-width:400px;width:min(var(--panel-width),calc(100vw - 32px));height:min(930px,calc(100dvh - 32px));min-height:390px;display:flex;flex-direction:column;gap:7px}
.toolbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px}
.toolbar label{display:flex;align-items:center;gap:5px;margin-right:auto}
.toolbar select{width:66px;font-size:11px}
.toolbar button{padding:2px 6px;font-size:11px;white-space:nowrap}
.toolbar button[aria-pressed=true]{background:#386d96;border-color:#80a3c3}
.toolbar-instruction{margin:0;color:var(--muted);font-size:10.5px;line-height:15px}
.command-panel{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--panel);border:1px solid #636363;box-shadow:0 2px 4px #0004}
.object-bar{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;background:#4c4c4c;border-bottom:1px solid #2d2d2d;font-size:11px}
.object-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.object-bar .mode-tab{color:#d7d7d7}
.modifier-stack{padding:5px 7px;border-bottom:1px solid #2c2c2c;background:#363636}
.modifier-stack div{background:#386585;border:1px solid #7492a8;padding:3px 6px;display:flex;justify-content:space-between;font-size:11px}
.panel-title{margin:0;padding:7px 8px 4px;font-size:13px;font-weight:600}
.setup-controls{padding:2px 8px 6px;display:grid;gap:5px}
.update-row{display:flex;align-items:center;gap:12px}
.update-row .check{margin:0}
.update-row button{margin-left:auto;min-width:104px}
.check{display:flex;align-items:center;gap:5px;line-height:19px;min-width:0;cursor:pointer}
.check span{min-width:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.actions{display:flex;gap:5px;min-width:0}
.actions>*{flex:1;min-width:0}
.actions button{white-space:normal}
.field{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:6px;align-items:center;min-width:0;line-height:16px}
.field.compact{grid-template-columns:minmax(0,1fr) 59px}
.field label{min-width:0;overflow-wrap:anywhere}
.field.full{display:block}
.field.full>label{display:block;margin-bottom:3px;color:#dfdfdf;font-size:11px}
.breadcrumb{background:#303030;border-top:1px solid #515151;border-bottom:1px solid #515151;padding:6px 8px;font-size:11px;line-height:16px;overflow-wrap:anywhere}
.breadcrumb strong{font-weight:600;color:#d8e8f4}
.breadcrumb .owner-word{color:#bcbcbc;margin-right:3px}
.prototype-caption{margin:0;padding:4px 8px;color:#c6c6c6;font-size:10px;border-bottom:1px solid #2c2c2c}
.panel-scroll{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;padding:5px 5px 8px;scrollbar-color:#777 #343434;scrollbar-width:thin}
.panel-scroll::-webkit-scrollbar{width:9px}
.panel-scroll::-webkit-scrollbar-track{background:#343434}
.panel-scroll::-webkit-scrollbar-thumb{background:#747474;border:2px solid #343434}
.rollout{border:1px solid #5b5b5b;margin:0 0 5px;background:#404040}
.rollout>summary{display:flex;align-items:center;gap:5px;list-style:none;cursor:pointer;min-height:27px;padding:4px 6px;background:#4b4b4b;border-bottom:1px solid transparent;line-height:16px}
.rollout[open]>summary{border-bottom-color:#2e2e2e}
summary::-webkit-details-marker{display:none}
.rollout>summary::before,.advanced>summary::before{content:"";width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid #c7c7c7;flex:none;transform-origin:2px 4px}
.rollout[open]>summary::before,.advanced[open]>summary::before{transform:rotate(90deg)}
.summary-title{font-weight:600;min-width:0;flex:1}
.owner-badge{font-size:9.5px;color:#d0d0d0;font-weight:400;white-space:nowrap;padding:0 3px;border:1px solid #777;line-height:14px}
.rollout-content{padding:6px}
.row-group{padding:0;margin:0;min-inline-size:0;border:0}
.group-legend{font-size:10.5px;color:#cecece;width:100%;padding:0 0 4px;display:flex;align-items:center;gap:6px}
.group-legend .owner-badge{margin-left:auto}
.row-group+.row-group{margin-top:8px;padding-top:6px;border-top:1px solid #585858}
.field-row{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;margin-bottom:5px;gap:5px;align-items:start}
.field-row:last-child{margin-bottom:0}
.row-content{min-width:0}
.minmax{display:grid;grid-template-columns:66px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.minmax label{font-size:11px;line-height:16px}
.range-input{display:flex;gap:4px;align-items:center;min-width:0}
.range-input span{font-size:9px;color:#c5c5c5}
.hint{margin:2px 0 0;font-size:10.5px;color:var(--muted);line-height:15px;overflow-wrap:anywhere}
.advanced{border-top:1px solid #626262;margin-top:7px;padding-top:3px}
.advanced>summary{display:flex;list-style:none;align-items:center;gap:6px;padding:3px 0;color:#d2d2d2;font-size:11px;cursor:pointer}
.advanced>summary .advanced-note{margin-left:auto;font-size:9.5px;color:#c4c4c4}
.advanced-content{padding-top:6px}
.help-copy{margin:0 0 6px;font-size:11px;color:#d5d5d5;line-height:17px}
.help-copy:last-child{margin-bottom:0}
.status{padding:5px 8px;border-top:1px solid #676767;background:#363636;font-size:10.5px;line-height:15px;color:#d2d2d2;min-height:27px;overflow-wrap:anywhere}
.section-tools,.row-tools{display:none;align-items:center;gap:2px;flex:none}
.section-tools button,.row-tools button{width:17px;min-height:19px;padding:0;line-height:17px;font-size:11px}
.section-tools .drag-handle,.row-tools .drag-handle{cursor:grab;color:#d4d4d4}
.drag-handle:active{cursor:grabbing}
body.arranging .section-tools,body.arranging .row-tools{display:flex}
body.arranging .field-row{grid-template-columns:55px minmax(0,1fr)}
body.arranging .row-tools{padding-top:2px}
body.arranging .owner-badge{font-size:9px;padding:0 2px}
body.arranging .pair{gap:5px}
body.arranging .field.compact{grid-template-columns:minmax(0,1fr) 50px;gap:4px}
body.arranging .minmax{grid-template-columns:53px minmax(0,1fr) minmax(0,1fr);gap:4px}
body.arranging .range-input{display:block}
body.arranging .range-input span{display:block}
body.arranging .rollout>summary{cursor:default}
.drop-before{box-shadow:inset 0 2px 0 #9bc6e8}
.drop-after{box-shadow:inset 0 -2px 0 #9bc6e8}
.is-dragging{opacity:.55}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:360px){body{padding:8px}.study{width:min(var(--panel-width),calc(100vw - 16px));height:calc(100dvh - 16px)}.toolbar{gap:3px}.toolbar button{padding:2px 4px}.toolbar label{gap:3px}.toolbar select{width:62px}.owner-badge{font-size:9px}.update-row{gap:9px}.update-row button{min-width:95px}.pair{gap:6px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<section class="command-panel" aria-label="Modify command panel">
<header class="object-bar"><span class="object-name" id="object-name">CS_Scatter_001</span><span>Modify</span></header>
<div class="modifier-stack"><div><span>Cyrus Scatter</span><span aria-hidden="true">▾</span></div></div>
<h1 class="panel-title">Cyrus Scatter 0.73</h1>

<div class="breadcrumb" id="owner-breadcrumb" aria-label="Currently editing"></div>
<p class="prototype-caption">Layout prototype · no scene calculation</p>
<div class="panel-scroll" id="panel-scroll"><div id="rollouts"></div></div>
<footer class="status" id="status" role="status" aria-live="polite">Demo values · Save HTML keeps changes.</footer>
</section>
</main>
<script id="prototype-state" type="application/json">{}</script>

document.addEventListener('dragstart',function(e){
const h=e.target.closest('[data-layout-drag]');if(!arranging||!h){e.preventDefault();return;}
const kind=h.dataset.layoutKind,id=h.dataset.layoutId,group=h.dataset.layoutGroup||'';
if(kind==='section'&&!SECTION_ORDER.includes(id)){e.preventDefault();return;}
if(kind==='row'){const g=findGroup(group);if(!g||h.closest('fieldset[data-group]')!==g||h.closest('[data-row]').dataset.row!==id){e.preventDefault();return;}}
dragSession={kind:kind,id:id,group:group};
e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('application/x-cyrus-layout',JSON.stringify(dragSession));
const source=kind==='section'?h.closest('[data-section]'):h.closest('[data-row]');source.classList.add('is-dragging');
});
document.addEventListener('dragover',function(e){
if(!dragSession)return;e.preventDefault();
document.querySelectorAll('.drop-before,.drop-after').forEach(function(el){el.classList.remove('drop-before','drop-after');});
const target=dropTarget(e);if(!target||target.id===dragSession.id){e.dataTransfer.dropEffect='none';return;}
e.dataTransfer.dropEffect='move';const bounds=(target.hitbox||target.element).getBoundingClientRect(),after=e.clientY>bounds.top+bounds.height/2;target.element.classList.add(after?'drop-after':'drop-before');
});
document.addEventListener('drop',function(e){
if(!dragSession)return;e.preventDefault();const target=dropTarget(e);
let payload;try{payload=JSON.parse(e.dataTransfer.getData('application/x-cyrus-layout'));}catch(error){}
if(!target||!payload||payload.kind!==dragSession.kind||payload.id!==dragSession.id||payload.group!==dragSession.group){clearDrag();announce('Drop ignored. Move complete rows within their current group.');return;}
const bounds=(target.hitbox||target.element).getBoundingClientRect(),after=e.clientY>bounds.top+bounds.height/2;
const order=target.kind==='section'?state.ui.sections:state.ui.groups[target.group];
const moved=Array.isArray(order)&&reorderAt(order,dragSession.id,target.id,after);clearDrag();if(moved){render();announce('Presentation reordered. Settings and evaluation order were kept.');}
});
document.addEventListener('dragend',clearDrag);
window.addEventListener('pagehide',function(){if(exportUrl)URL.revokeObjectURL(exportUrl);});
render();
})();
</script>
</body>
</html>
